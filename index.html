<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunrise & Sunset Dashboard</title>
  <link rel="stylesheet" href="script.js"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <header>
    <h1>Sunrise & Sunset Dashboard</h1>
    <p>Select a location to get today and tomorrow's sunrise/sunset data.</p>
    <label for="locationSelect" class="visually-hidden">Choose a location</label>
    <select id="locationSelect">
      <option value="">-- Choose a location --</option>
      <option value="">New York, NY</option>
      <option value="">Los Angeles, CA</option>
      <option value="">Chicago, IL</option>
      <option value="">Houston, TX</option>
      <option value="">Atlanta, GA</option>
      <option value="">Seattle, WA</option>
      <option value="">Miami, FL</option>
      <option value="">Denver, CO</option>
      <option value="">Minneapolis, MN</option>
      <option value="">Dallas, TX</option>
    </select>
  </header>

  <main>
    <div id="dashboard" class="dashboard">
      <div class="card">
        <h2>Today</h2>
        <div id="todayData">Please select a location above.</div>
      </div>
      <div class="card">
        <h2>Tomorrow</h2>
        <div id="tomorrowData">Please select a location above.</div>
      </div>
    </div>
  </main>

  <footer>
    <p>Data provided by <a href="https://sunrisesunset.io/api/" target="_blank">SunriseSunset.io API</a></p>
  </footer>

  <script src="scripts.js"></script>
</body>
</html>
